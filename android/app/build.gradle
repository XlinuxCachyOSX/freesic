plugins {
    id 'com.android.application'
}

android {
    namespace 'com.freesic.player'
    compileSdk 34

    defaultConfig {
        applicationId "com.freesic.player"
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "1.2.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*', 'META-INF/**']
        }
    }
}

// l'interfaccia web e' la stessa del computer: viene copiata negli asset
tasks.register('copiaWeb', Copy) {
    from "${rootDir}/../web"
    into "${projectDir}/src/main/assets"
}
preBuild.dependsOn copiaWeb

dependencies {
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
